<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-label="toolgz level 3. Before: 149 MCP tool definitions in full, 68,536 prompt tokens. After: two tools on the wire, t and q, plus a cached toolmap in the system prompt, 3,022 prompt tokens, 95.6% reclaimed. The model calls t with a map code, resolve returns the real tool name and arguments, and the dispatcher runs unchanged."><rect width="1200" height="700" fill="#141413"/><text x="48" y="52" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#5ea1f0" letter-spacing="1.6">LEVEL 3 — DISPATCHER + CACHED MAP</text><text x="48" y="96" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="36" font-weight="700" fill="#ffffff">149 tools in. Two tools on the wire.</text><text x="1152" y="74" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="52" font-weight="700" fill="#0ca30c" text-anchor="end">95.6%</text><text x="1152" y="96" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="400" fill="#c3c2b7" text-anchor="end">of the tool block reclaimed</text><rect x="48" y="136" width="520" height="336" rx="12" fill="#1f1f1e"/><text x="68" y="166" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="700" fill="#8a8983" letter-spacing="1.4">BEFORE</text><text x="68" y="188" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14" font-weight="600" fill="#ffffff">every tool, in full, on every request</text><rect x="68" y="202" width="480" height="216" rx="8" fill="#292928"/><text x="80" y="224" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.6" font-weight="400" fill="#d8d6cf">{</text><text x="80" y="236.4" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.6" font-weight="400" fill="#d8d6cf">  "name": "get_call_recordings",</text><text x="80" y="248.8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.6" font-weight="400" fill="#d8d6cf">"description": "Get call recordings for an order. Returns all</text><text x="80" y="261.2" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.6" font-weight="400" fill="#d8d6cf">      phone call recordings associated with the order,</text><text x="80" y="273.6" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.6" font-weight="400" fill="#d8d6cf">      including call metadata (type, queue, agent, duration),</text><text x="80" y="286" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.6" font-weight="400" fill="#d8d6cf">      Azure Blob storage URLs for audio files, and</text><text x="80" y="298.4" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.6" font-weight="400" fill="#d8d6cf">      AI-generated summaries/sentiment analysis if available.</text><text x="80" y="310.8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.6" font-weight="400" fill="#d8d6cf">      Returns empty array if no recordings exist.",</text><text x="80" y="323.2" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.6" font-weight="400" fill="#d8d6cf">  "inputSchema": {</text><text x="80" y="335.6" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.6" font-weight="400" fill="#d8d6cf">    "type": "object",</text><text x="80" y="348" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.6" font-weight="400" fill="#d8d6cf">    "properties": {</text><text x="80" y="360.4" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.6" font-weight="400" fill="#d8d6cf">      "orderId": {</text><text x="80" y="372.8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.6" font-weight="400" fill="#d8d6cf">        "type": "string",</text><rect x="69" y="382" width="478" height="35" rx="6" fill="#292928"/><text x="80" y="404" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" font-weight="400" fill="#8a8983">…and 148 more tools, every request</text><text x="68" y="444" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="17" font-weight="700" fill="#ffffff">68,536 prompt tokens</text><text x="68" y="462" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" font-weight="400" fill="#c3c2b7">34% of a 200k window before the user speaks</text><circle cx="598" cy="304" r="17" fill="#5ea1f0"/><path d="M591 304 L604 304 M599 299 L604 304 L599 309" stroke="#141413" stroke-width="2.1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="598" y="340" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="400" fill="#8a8983" text-anchor="middle">compress</text><text x="598" y="353" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="400" fill="#8a8983" text-anchor="middle">level: 3</text><rect x="632" y="136" width="520" height="336" rx="12" fill="#1f1f1e"/><text x="652" y="166" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="700" fill="#5ea1f0" letter-spacing="1.4">AFTER</text><text x="652" y="188" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14" font-weight="600" fill="#ffffff">two tools, and a map you cache once</text><rect x="652" y="202" width="480" height="62" rx="8" fill="#292928"/><text x="664" y="220" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.5" font-weight="700" fill="#8a8983" letter-spacing="1.2">ON THE WIRE</text><text x="664" y="238" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="400" fill="#5ea1f0">t(f, a)</text><text x="742" y="238" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="400" fill="#c3c2b7">dispatch by map code</text><text x="664" y="255" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="400" fill="#5ea1f0">q(c, s)</text><text x="742" y="255" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="400" fill="#c3c2b7">expand a code, or search the map</text><rect x="652" y="276" width="480" height="142" rx="8" fill="#292928"/><text x="664" y="294" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.5" font-weight="700" fill="#8a8983" letter-spacing="1.2">IN THE SYSTEM PROMPT</text><text x="842" y="294" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.5" font-weight="600" fill="#bd8010">◆ behind a cache breakpoint</text><text x="664" y="314" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.4" font-weight="400" fill="#8a8983">&lt;toolmap&gt;</text><text x="664" y="331" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.4" font-weight="400" fill="#d8d6cf">a0 accessorial_revenue_details</text><text x="664" y="346" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.4" font-weight="400" fill="#d8d6cf">b0 active_locations</text><text x="664" y="361" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.4" font-weight="400" fill="#d8d6cf">c0 analyze_blob_with_gemini analysis_type,prompt</text><text x="664" y="376" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.4" font-weight="400" fill="#d8d6cf">bk0 zipcode_zone</text><text x="664" y="391" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.4" font-weight="400" fill="#8a8983">…145 more lines</text><text x="664" y="408" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.4" font-weight="400" fill="#8a8983">&lt;/toolmap&gt;</text><text x="652" y="444" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="17" font-weight="700" fill="#0ca30c">3,022 prompt tokens</text><text x="652" y="462" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" font-weight="400" fill="#c3c2b7">and it does not grow the way the block did</text><rect x="48" y="502" width="1104" height="122" rx="12" fill="#1f1f1e"/><text x="68" y="529" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="700" fill="#8a8983" letter-spacing="1.4">HOW IT IS CALLED</text><circle cx="76" cy="550" r="8" fill="#5ea1f0"/><text x="76" y="553.5" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10" font-weight="700" fill="#141413" text-anchor="middle">1</text><text x="92" y="554" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" font-weight="400" fill="#c3c2b7">the model emits</text><text x="232" y="554" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.6" font-weight="400" fill="#d8d6cf">t(f="c0", a={"analysis_type": "vision", "prompt": "…"})</text><circle cx="76" cy="572" r="8" fill="#5ea1f0"/><text x="76" y="575.5" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10" font-weight="700" fill="#141413" text-anchor="middle">2</text><text x="92" y="576" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" font-weight="400" fill="#c3c2b7">c.resolve() returns</text><text x="232" y="576" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.6" font-weight="400" fill="#d8d6cf">{ kind: "call", name: "analyze_blob_with_gemini", args: {…} }</text><circle cx="76" cy="594" r="8" fill="#0ca30c"/><text x="76" y="597.5" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10" font-weight="700" fill="#141413" text-anchor="middle">3</text><text x="92" y="598" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" font-weight="400" fill="#c3c2b7">your dispatcher runs</text><text x="232" y="598" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.6" font-weight="400" fill="#0ca30c">analyze_blob_with_gemini({…})   ← unchanged</text><text x="48" y="678" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#ffffff">npm install toolgz</text><text x="196" y="678" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="400" fill="#8a8983">zero runtime dependencies · Apache-2.0 · every figure here generated by running the library</text><text x="1152" y="678" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="400" fill="#bd8010" text-anchor="end">validate: true — toolgz checks args against your original schema</text></svg>