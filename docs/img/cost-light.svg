<svg xmlns="http://www.w3.org/2000/svg" width="760" height="346" viewBox="0 0 760 346" role="img" aria-label="Prompt token reduction versus cost change by provider"><rect width="760" height="346" fill="#fcfcfb"/><text x="20" y="30" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="17" font-weight="600" fill="#0b0b0b">Smaller context on all four — and now cheaper on all four</text><text x="20" y="52" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#52514e"><tspan x="20" dy="0">Level 3 at the shipped default vs uncompressed, reasoning enabled on all four. Cost was +15% on OpenAI until</tspan><tspan x="20" dy="18.125">the resolver stopped wasting turns on recoverable argument errors.</tspan></text><text x="116" y="98" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="600" fill="#898781">PROMPT TOKENS</text><text x="396" y="98" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="600" fill="#898781">COST (green = cheaper, red = dearer)</text><text x="96" y="130" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#52514e" text-anchor="end">Anthropic</text><rect x="116" y="116" width="152.96573356985246" height="16" rx="4" fill="#2a78d6"/><text x="274.96573356985243" y="129" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" font-weight="600" fill="#0b0b0b">-85%</text><rect x="396" y="116" width="109.73700341402855" height="16" rx="4" fill="#006300"/><text x="511.73700341402855" y="129" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" font-weight="600" fill="#006300">-78%</text><text x="96" y="170" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#52514e" text-anchor="end">Google</text><rect x="116" y="156" width="142.14737636936044" height="16" rx="4" fill="#2a78d6"/><text x="264.1473763693605" y="169" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" font-weight="600" fill="#0b0b0b">-79%</text><rect x="396" y="156" width="86.47595542356137" height="16" rx="4" fill="#006300"/><text x="488.47595542356135" y="169" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" font-weight="600" fill="#006300">-62%</text><text x="96" y="210" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#52514e" text-anchor="end">OpenAI</text><rect x="116" y="196" width="128.63180695750117" height="16" rx="4" fill="#2a78d6"/><text x="250.63180695750117" y="209" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" font-weight="600" fill="#0b0b0b">-71%</text><rect x="396" y="196" width="10.131552136679154" height="16" rx="4" fill="#006300"/><text x="412.13155213667915" y="209" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" font-weight="600" fill="#006300">-7%</text><text x="96" y="250" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#52514e" text-anchor="end">xAI</text><rect x="116" y="236" width="152.64701853711992" height="16" rx="4" fill="#2a78d6"/><text x="274.64701853711995" y="249" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" font-weight="600" fill="#0b0b0b">-85%</text><rect x="396" y="236" width="97.8379882751129" height="16" rx="4" fill="#006300"/><text x="499.83798827511293" y="249" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" font-weight="600" fill="#006300">-70%</text><text x="20" y="306" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10.5" fill="#898781"><tspan x="20" dy="0">OpenAI's -7% is modest because reasoning output dominates its bill, so a smaller prompt moves the total less. Context-window</tspan><tspan x="20" dy="15.225">occupancy is still the primary claim; cost follows from it, and by how much depends on your reasoning settings.</tspan></text></svg>