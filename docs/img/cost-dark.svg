<svg xmlns="http://www.w3.org/2000/svg" width="760" height="346" viewBox="0 0 760 346" role="img" aria-label="Prompt token reduction versus cost change by provider"><rect width="760" height="346" fill="#1a1a19"/><text x="20" y="30" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="17" font-weight="600" fill="#ffffff">Context is always reclaimed. Money is not.</text><text x="20" y="52" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#c3c2b7"><tspan x="20" dy="0">Level 3 (shipped default) vs uncompressed, reasoning enabled on all four. Prompt tokens always fall; spend</tspan><tspan x="20" dy="18.125">depends on how much the model reasons across the extra turns.</tspan></text><text x="116" y="98" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="600" fill="#898781">PROMPT TOKENS</text><text x="396" y="98" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="600" fill="#898781">COST (green = cheaper, red = dearer)</text><text x="96" y="130" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#c3c2b7" text-anchor="end">Anthropic</text><rect x="116" y="116" width="147.6146303655131" height="16" rx="4" fill="#3987e5"/><text x="269.6146303655131" y="129" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" font-weight="600" fill="#ffffff">-82%</text><rect x="396" y="116" width="106.02321442188055" height="16" rx="4" fill="#0ca30c"/><text x="508.02321442188054" y="129" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" font-weight="600" fill="#0ca30c">-76%</text><text x="96" y="170" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#c3c2b7" text-anchor="end">Google</text><rect x="116" y="156" width="144.13218611278566" height="16" rx="4" fill="#3987e5"/><text x="266.1321861127857" y="169" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" font-weight="600" fill="#ffffff">-80%</text><rect x="396" y="156" width="86.84390756868983" height="16" rx="4" fill="#0ca30c"/><text x="488.8439075686898" y="169" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" font-weight="600" fill="#0ca30c">-62%</text><text x="96" y="210" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#c3c2b7" text-anchor="end">OpenAI</text><rect x="116" y="196" width="123.81757508342604" height="16" rx="4" fill="#3987e5"/><text x="245.81757508342605" y="209" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" font-weight="600" fill="#ffffff">-69%</text><rect x="396" y="196" width="21.286083475499517" height="16" rx="4" fill="#e66767"/><text x="423.28608347549954" y="209" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" font-weight="600" fill="#e66767">+15%</text><text x="96" y="250" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#c3c2b7" text-anchor="end">xAI</text><rect x="116" y="236" width="144.62378465141367" height="16" rx="4" fill="#3987e5"/><text x="266.62378465141364" y="249" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" font-weight="600" fill="#ffffff">-80%</text><rect x="396" y="236" width="84.58706283509433" height="16" rx="4" fill="#0ca30c"/><text x="486.58706283509434" y="249" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" font-weight="600" fill="#0ca30c">-60%</text><text x="20" y="306" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10.5" fill="#898781"><tspan x="20" dy="0">On OpenAI the extra dispatcher turns cost more in reasoning tokens than the smaller prompt saves. The context-window win holds</tspan><tspan x="20" dy="15.225">regardless - that is the claim this library makes.</tspan></text></svg>