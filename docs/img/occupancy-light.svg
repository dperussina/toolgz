<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-label="A 200,000 token context window shown twice. Uncompressed, 149 MCP tool definitions occupy 68,536 tokens, 34.3 percent of the window, before the user says anything. At level 3 the same tools occupy 3,022 tokens, 1.5 percent. 434 real tools fit in 200k uncompressed against ~10,000 at level 3, and 95.6% of the tool block is reclaimed."><rect width="1200" height="620" fill="#fcfcfb"/><rect x="48" y="40" width="34" height="34" rx="7.989999999999999" fill="#2a78d6"/><rect x="55.480000000000004" y="47.480000000000004" width="19.04" height="3.672" rx="1.836" fill="#fff"/><rect x="55.480000000000004" y="55.164" width="11.8048" height="3.672" rx="1.836" fill="#fff"/><rect x="55.480000000000004" y="62.848" width="4.9504" height="3.672" rx="1.836" fill="#fff"/><text x="92" y="64" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="21" font-weight="800" fill="#0b0b0b">toolgz</text><text x="48" y="124" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="32" font-weight="700" fill="#0b0b0b">Your 200k context window, before the user says a word</text><text x="48" y="152" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13.5" font-weight="400" fill="#52514e">149 tools from 14 live MCP servers, measured with Anthropic's count_tokens on claude-opus-5.</text><text x="48" y="198" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12.5" font-weight="700" fill="#898781" letter-spacing="1.2">UNCOMPRESSED — TOOL DEFINITIONS ALONE</text><rect x="48" y="210" width="1104" height="62" rx="8" fill="#e7e5dc"/><rect x="50" y="212" width="374.31872" height="58" rx="6" fill="#8a5a00"/><text x="1138" y="246" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="end">the rest is yours</text><text x="66" y="239" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="15" font-weight="700" fill="#fff">68,536 tokens</text><text x="66" y="257" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" font-weight="400" fill="#fff">34.3% of the window</text><text x="48" y="318" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12.5" font-weight="700" fill="#898781" letter-spacing="1.2">AT LEVEL 3</text><rect x="48" y="330" width="1104" height="62" rx="8" fill="#e7e5dc"/><rect x="50" y="332" width="12.681439999999998" height="58" rx="6" fill="#2a78d6"/><text x="1138" y="366" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="end">the rest is yours</text><text x="76.68144" y="359" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="15" font-weight="700" fill="#0b0b0b">3,022 tokens</text><text x="76.68144" y="377" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" font-weight="400" fill="#898781">1.5% of the window</text><rect x="48" y="424" width="1104" height="132" rx="12" fill="#f4f3ee"/><text x="74" y="454" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="700" fill="#898781" letter-spacing="1.2">HOW MANY REAL TOOLS FIT IN 200K</text><text x="74" y="512" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="42" font-weight="800" fill="#0b0b0b">434</text><text x="74" y="538" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="400" fill="#52514e">real tools fit uncompressed</text><text x="424.6666666666667" y="512" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="42" font-weight="800" fill="#006300">~10,000</text><text x="424.6666666666667" y="538" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="400" fill="#52514e">fit at level 3</text><text x="775.3333333333334" y="512" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="42" font-weight="800" fill="#006300">95.6%</text><text x="775.3333333333334" y="538" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="400" fill="#52514e">of the tool block reclaimed</text><text x="48" y="596" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13.5" font-weight="700" fill="#0b0b0b">npm install toolgz</text><text x="196" y="596" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="400" fill="#898781">zero runtime dependencies · Apache-2.0 · raw per-run records committed to the repo</text></svg>