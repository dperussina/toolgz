<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="492" viewBox="0 0 1500 492" role="img" aria-label="Restaurant metaphor for toolgz compression levels. Level 0: the full menu, 149 tools on the wire, nothing saved, kitchen checks the order. Level 1: the same menu with prose cut, 149 tools on the wire, 45.1% smaller, kitchen still checks the order. Level 3: a numbered card and one waiter, 2 tools on the wire, 96.5% smaller, toolgz checks the order instead of the provider."><rect width="1500" height="492" fill="#141413"/><text x="24" y="34" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="19" font-weight="600" fill="#ffffff">Your tool definitions are a menu handed over at every request</text><text x="24" y="56" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#c3c2b7">Figures are the real 149-tool corpus from 14 live MCP servers. Character counts, measured by running the library.</text><rect x="24" y="78" width="282" height="368" rx="10" fill="#242423"/><text x="40" y="104" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="600" fill="#3987e5" letter-spacing="0.6">LEVEL 0</text><text x="40" y="124" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14" font-weight="600" fill="#ffffff">The menu as written</text><rect x="40" y="140" width="150" height="132" rx="6" fill="#141413" stroke="#2c2c2a" stroke-width="1.5"/><text x="52" y="161" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10.5" font-weight="600" fill="#ffffff">MENU</text><rect x="52" y="172" width="126" height="4.5" rx="2.25" fill="#c3c2b7" opacity="0.75"/><rect x="52" y="181" width="112" height="4.5" rx="2.25" fill="#898781" opacity="0.45"/><rect x="52" y="190" width="120" height="4.5" rx="2.25" fill="#898781" opacity="0.45"/><rect x="52" y="199" width="104" height="4.5" rx="2.25" fill="#c3c2b7" opacity="0.75"/><rect x="52" y="208" width="118" height="4.5" rx="2.25" fill="#898781" opacity="0.45"/><rect x="52" y="217" width="126" height="4.5" rx="2.25" fill="#898781" opacity="0.45"/><rect x="52" y="226" width="112" height="4.5" rx="2.25" fill="#c3c2b7" opacity="0.75"/><rect x="52" y="235" width="120" height="4.5" rx="2.25" fill="#898781" opacity="0.45"/><rect x="52" y="244" width="104" height="4.5" rx="2.25" fill="#898781" opacity="0.45"/><rect x="52" y="253" width="118" height="4.5" rx="2.25" fill="#c3c2b7" opacity="0.75"/><rect x="52" y="262" width="126" height="4.5" rx="2.25" fill="#898781" opacity="0.45"/><text x="40" y="288" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#c3c2b7"><tspan x="40" dy="0">Every dish gets a paragraph about the</tspan><tspan x="40" dy="15.62">chef's inspiration. Handed to the model at</tspan><tspan x="40" dy="15.62">the start of every single request.</tspan></text><line x1="40" y1="360" x2="290" y2="360" stroke="#2c2c2a" stroke-width="1"/><text x="40" y="379" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" fill="#898781">149 tools on the wire</text><text x="40" y="397" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="600" fill="#898781">nothing saved</text><circle cx="46" cy="414" r="4.5" fill="#0ca30c"/><text x="56" y="418" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#c3c2b7">Kitchen checks the order</text><rect x="318" y="78" width="282" height="368" rx="10" fill="#242423"/><text x="334" y="104" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="600" fill="#3987e5" letter-spacing="0.6">LEVEL 1</text><text x="334" y="124" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14" font-weight="600" fill="#ffffff">Same menu, prose cut</text><rect x="334" y="140" width="150" height="132" rx="6" fill="#141413" stroke="#2c2c2a" stroke-width="1.5"/><text x="346" y="161" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10.5" font-weight="600" fill="#ffffff">MENU</text><rect x="346" y="172" width="74" height="4.5" rx="2.25" fill="#c3c2b7" opacity="0.75"/><rect x="346" y="181" width="62" height="4.5" rx="2.25" fill="#898781" opacity="0.45"/><rect x="346" y="190" width="80" height="4.5" rx="2.25" fill="#898781" opacity="0.45"/><rect x="346" y="199" width="58" height="4.5" rx="2.25" fill="#c3c2b7" opacity="0.75"/><rect x="346" y="208" width="68" height="4.5" rx="2.25" fill="#898781" opacity="0.45"/><rect x="346" y="217" width="74" height="4.5" rx="2.25" fill="#898781" opacity="0.45"/><rect x="346" y="226" width="62" height="4.5" rx="2.25" fill="#c3c2b7" opacity="0.75"/><rect x="346" y="235" width="80" height="4.5" rx="2.25" fill="#898781" opacity="0.45"/><rect x="346" y="244" width="58" height="4.5" rx="2.25" fill="#898781" opacity="0.45"/><rect x="346" y="253" width="68" height="4.5" rx="2.25" fill="#c3c2b7" opacity="0.75"/><rect x="346" y="262" width="74" height="4.5" rx="2.25" fill="#898781" opacity="0.45"/><text x="334" y="288" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#c3c2b7"><tspan x="334" dy="0">One line per dish: the name and what it</tspan><tspan x="334" dy="15.62">needs. Still a real menu — the model points</tspan><tspan x="334" dy="15.62">at a dish by name, and the kitchen checks</tspan><tspan x="334" dy="15.62">the order before cooking.</tspan></text><line x1="334" y1="360" x2="584" y2="360" stroke="#2c2c2a" stroke-width="1"/><text x="334" y="379" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" fill="#898781">149 tools on the wire</text><text x="334" y="397" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="600" fill="#0ca30c">45.1% smaller</text><circle cx="340" cy="414" r="4.5" fill="#0ca30c"/><text x="350" y="418" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#c3c2b7">Kitchen checks the order</text><rect x="612" y="78" width="282" height="368" rx="10" fill="#242423"/><text x="628" y="104" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="600" fill="#3987e5" letter-spacing="0.6">LEVEL 2</text><text x="628" y="124" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14" font-weight="600" fill="#ffffff">One waiter per section</text><rect x="628" y="140" width="150" height="132" rx="6" fill="#141413" stroke="#2c2c2a" stroke-width="1.5"/><text x="640" y="164" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.5" font-weight="600" fill="#ffffff">GRILL</text><rect x="640" y="170" width="96" height="4.5" rx="2.25" fill="#c3c2b7" opacity="0.75"/><rect x="640" y="179" width="74" height="4.5" rx="2.25" fill="#898781" opacity="0.45"/><text x="640" y="204" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.5" font-weight="600" fill="#ffffff">PASTA</text><rect x="640" y="210" width="96" height="4.5" rx="2.25" fill="#c3c2b7" opacity="0.75"/><rect x="640" y="219" width="74" height="4.5" rx="2.25" fill="#898781" opacity="0.45"/><text x="640" y="244" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.5" font-weight="600" fill="#ffffff">SIDES</text><rect x="640" y="250" width="96" height="4.5" rx="2.25" fill="#c3c2b7" opacity="0.75"/><rect x="640" y="259" width="74" height="4.5" rx="2.25" fill="#898781" opacity="0.45"/><text x="628" y="288" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#c3c2b7"><tspan x="628" dy="0">Order by section instead of by dish: "from</tspan><tspan x="628" dy="15.62">the grill, the ribeye". Fewer people to</tspan><tspan x="628" dy="15.62">talk to, and the dish names are still real</tspan><tspan x="628" dy="15.62">— but the kitchen stops checking your</tspan><tspan x="628" dy="15.62">order.</tspan></text><line x1="628" y1="360" x2="878" y2="360" stroke="#2c2c2a" stroke-width="1"/><text x="628" y="379" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" fill="#898781">64 tools on the wire</text><text x="628" y="397" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="600" fill="#0ca30c">89.3% smaller</text><path d="M634 409 L639 418 L629 418 Z" fill="#bd8010"/><text x="644" y="418" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#c3c2b7">toolgz checks the order</text><rect x="906" y="78" width="282" height="368" rx="10" fill="#242423"/><text x="922" y="104" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="600" fill="#3987e5" letter-spacing="0.6">LEVEL 3</text><text x="922" y="124" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14" font-weight="600" fill="#ffffff">A numbered card and one waiter</text><rect x="922" y="140" width="92" height="62" rx="6" fill="#141413" stroke="#2c2c2a" stroke-width="1.5"/><text x="930" y="157" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="8" fill="#3987e5">z0 fifo</text><text x="930" y="170" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="8" fill="#3987e5">r0 customers</text><text x="930" y="183" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="8" fill="#3987e5">e0 ar_summary</text><text x="930" y="196" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="8" fill="#898781">…</text><circle cx="1048" cy="153" r="7.5" fill="none" stroke="#c3c2b7" stroke-width="1.7"/><path d="M1038 190 L1040.5 167 Q1048 163 1055.5 167 L1058 190 Z" fill="none" stroke="#c3c2b7" stroke-width="1.7" stroke-linejoin="round"/><path d="M1041 171 L1031 166" fill="none" stroke="#c3c2b7" stroke-width="1.7" stroke-linecap="round"/><line x1="1023" y1="164" x2="1039" y2="164" stroke="#3987e5" stroke-width="2.5" stroke-linecap="round"/><path d="M1027 164 q4 -5 8 0" fill="none" stroke="#3987e5" stroke-width="1.5"/><rect x="922" y="210" width="150" height="58" rx="6" fill="#141413" stroke="#2c2c2a" stroke-width="1.5"/><text x="931" y="227" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.5" font-weight="600" fill="#ffffff">Needs detail? It asks.</text><text x="931" y="242" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="8.5" fill="#3987e5">q(c="a0")</text><text x="931" y="258" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9" fill="#c3c2b7">"what does a0 come with?"</text><text x="922" y="288" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#c3c2b7"><tspan x="922" dy="0">The model says "number 12, no onions" and</tspan><tspan x="922" dy="15.62">the waiter knows what that means. Tiny —</tspan><tspan x="922" dy="15.62">but the kitchen no longer checks the order,</tspan><tspan x="922" dy="15.62">so toolgz checks it instead.</tspan></text><line x1="922" y1="360" x2="1172" y2="360" stroke="#2c2c2a" stroke-width="1"/><text x="922" y="379" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" fill="#898781">2 tools on the wire</text><text x="922" y="397" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="600" fill="#0ca30c">96.5% smaller</text><path d="M928 409 L933 418 L923 418 Z" fill="#bd8010"/><text x="938" y="418" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#c3c2b7">toolgz checks the order</text><rect x="1200" y="78" width="282" height="368" rx="10" fill="#242423"/><text x="1216" y="104" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="600" fill="#3987e5" letter-spacing="0.6">LEVEL 4</text><text x="1216" y="124" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14" font-weight="600" fill="#ffffff">The card, annotated</text><rect x="1216" y="140" width="150" height="132" rx="6" fill="#141413" stroke="#2c2c2a" stroke-width="1.5"/><text x="1225" y="162" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="7.5" fill="#3987e5">check_health()</text><text x="1225" y="173" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="7" fill="#c3c2b7">"TagNext API health status…"</text><text x="1225" y="196" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="7.5" fill="#3987e5">get_order_notes(trackingN</text><text x="1225" y="207" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="7" fill="#c3c2b7">"notes only for an order…"</text><text x="1225" y="230" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="7.5" fill="#3987e5">coding_task_status(taskId</text><text x="1225" y="241" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="7" fill="#c3c2b7">"progress/state of coding t…"</text><text x="1225" y="264" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="8" fill="#898781">…146 more</text><text x="1216" y="288" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#c3c2b7"><tspan x="1216" dy="0">Same numbered card, but someone who knows</tspan><tspan x="1216" dy="15.62">the kitchen wrote a note beside each number</tspan><tspan x="1216" dy="15.62">saying what it is good for. Bigger than the</tspan><tspan x="1216" dy="15.62">bare card — and nobody has to ask.</tspan></text><line x1="1216" y1="360" x2="1466" y2="360" stroke="#2c2c2a" stroke-width="1"/><text x="1216" y="379" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" fill="#898781">2 tools on the wire</text><text x="1216" y="397" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="600" fill="#0ca30c">82.6% smaller</text><path d="M1222 409 L1227 418 L1217 418 Z" fill="#bd8010"/><text x="1232" y="418" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#c3c2b7">toolgz checks the order</text><text x="24" y="474" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#898781">The trade is who checks the order, not whether it gets checked. recommendLevel() picks by block size; you pass its answer in.</text></svg>