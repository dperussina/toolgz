<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-label="Restaurant metaphor for toolgz compression levels. Level 0: the full menu, 149 tools on the wire, nothing saved, kitchen checks the order. Level 1: the same menu with prose cut, 149 tools on the wire, 45.2% smaller, kitchen still checks the order. Level 3: a numbered card and one waiter, 2 tools on the wire, 96.5% smaller, toolgz checks the order instead of the provider."><rect width="900" height="470" fill="#1a1a19"/><text x="24" y="34" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="19" font-weight="600" fill="#ffffff">Your tool definitions are a menu handed over at every request</text><text x="24" y="56" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#c3c2b7">Figures are the real 149-tool corpus from 14 live MCP servers. Character counts, measured by running the library.</text><rect x="24" y="78" width="276" height="346" rx="10" fill="#242423"/><text x="40" y="104" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="600" fill="#3987e5" letter-spacing="0.6">LEVEL 0</text><text x="40" y="124" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14" font-weight="600" fill="#ffffff">The menu as written</text><rect x="40" y="140" width="150" height="132" rx="6" fill="#1a1a19" stroke="#2c2c2a" stroke-width="1.5"/><text x="52" y="161" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10.5" font-weight="600" fill="#ffffff">MENU</text><rect x="52" y="172" width="126" height="4.5" rx="2.25" fill="#c3c2b7" opacity="0.75"/><rect x="52" y="181" width="112" height="4.5" rx="2.25" fill="#898781" opacity="0.45"/><rect x="52" y="190" width="120" height="4.5" rx="2.25" fill="#898781" opacity="0.45"/><rect x="52" y="199" width="104" height="4.5" rx="2.25" fill="#c3c2b7" opacity="0.75"/><rect x="52" y="208" width="118" height="4.5" rx="2.25" fill="#898781" opacity="0.45"/><rect x="52" y="217" width="126" height="4.5" rx="2.25" fill="#898781" opacity="0.45"/><rect x="52" y="226" width="112" height="4.5" rx="2.25" fill="#c3c2b7" opacity="0.75"/><rect x="52" y="235" width="120" height="4.5" rx="2.25" fill="#898781" opacity="0.45"/><rect x="52" y="244" width="104" height="4.5" rx="2.25" fill="#898781" opacity="0.45"/><rect x="52" y="253" width="118" height="4.5" rx="2.25" fill="#c3c2b7" opacity="0.75"/><rect x="52" y="262" width="126" height="4.5" rx="2.25" fill="#898781" opacity="0.45"/><text x="40" y="290" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" fill="#c3c2b7"><tspan x="40" dy="0">Every dish gets a paragraph about the</tspan><tspan x="40" dy="16.33">chef's inspiration. Handed to the model</tspan><tspan x="40" dy="16.33">at the start of every single request.</tspan></text><line x1="40" y1="346" x2="284" y2="346" stroke="#2c2c2a" stroke-width="1"/><text x="40" y="365" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" fill="#898781">149 tools on the wire</text><text x="40" y="383" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="600" fill="#898781">nothing saved</text><circle cx="46" cy="400" r="4.5" fill="#0ca30c"/><text x="56" y="404" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#c3c2b7">Kitchen checks the order</text><rect x="316" y="78" width="276" height="346" rx="10" fill="#242423"/><text x="332" y="104" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="600" fill="#3987e5" letter-spacing="0.6">LEVEL 1</text><text x="332" y="124" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14" font-weight="600" fill="#ffffff">Same menu, prose cut</text><rect x="332" y="140" width="150" height="132" rx="6" fill="#1a1a19" stroke="#2c2c2a" stroke-width="1.5"/><text x="344" y="161" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10.5" font-weight="600" fill="#ffffff">MENU</text><rect x="344" y="172" width="74" height="4.5" rx="2.25" fill="#c3c2b7" opacity="0.75"/><rect x="344" y="181" width="62" height="4.5" rx="2.25" fill="#898781" opacity="0.45"/><rect x="344" y="190" width="80" height="4.5" rx="2.25" fill="#898781" opacity="0.45"/><rect x="344" y="199" width="58" height="4.5" rx="2.25" fill="#c3c2b7" opacity="0.75"/><rect x="344" y="208" width="68" height="4.5" rx="2.25" fill="#898781" opacity="0.45"/><rect x="344" y="217" width="74" height="4.5" rx="2.25" fill="#898781" opacity="0.45"/><rect x="344" y="226" width="62" height="4.5" rx="2.25" fill="#c3c2b7" opacity="0.75"/><rect x="344" y="235" width="80" height="4.5" rx="2.25" fill="#898781" opacity="0.45"/><rect x="344" y="244" width="58" height="4.5" rx="2.25" fill="#898781" opacity="0.45"/><rect x="344" y="253" width="68" height="4.5" rx="2.25" fill="#c3c2b7" opacity="0.75"/><rect x="344" y="262" width="74" height="4.5" rx="2.25" fill="#898781" opacity="0.45"/><text x="332" y="290" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" fill="#c3c2b7"><tspan x="332" dy="0">One line per dish: the name and what it</tspan><tspan x="332" dy="16.33">needs. Still a real menu — the model</tspan><tspan x="332" dy="16.33">points at a dish by name, and the</tspan><tspan x="332" dy="16.33">kitchen checks the order before cooking.</tspan></text><line x1="332" y1="346" x2="576" y2="346" stroke="#2c2c2a" stroke-width="1"/><text x="332" y="365" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" fill="#898781">149 tools on the wire</text><text x="332" y="383" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="600" fill="#0ca30c">45.2% smaller</text><circle cx="338" cy="400" r="4.5" fill="#0ca30c"/><text x="348" y="404" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#c3c2b7">Kitchen checks the order</text><rect x="608" y="78" width="276" height="346" rx="10" fill="#242423"/><text x="624" y="104" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="600" fill="#3987e5" letter-spacing="0.6">LEVEL 3</text><text x="624" y="124" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14" font-weight="600" fill="#ffffff">A numbered card and one waiter</text><rect x="624" y="140" width="92" height="62" rx="6" fill="#1a1a19" stroke="#2c2c2a" stroke-width="1.5"/><text x="632" y="157" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="8" fill="#3987e5">a0 sheets_append</text><text x="632" y="170" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="8" fill="#3987e5">a1 sheets_update</text><text x="632" y="183" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="8" fill="#3987e5">b0 post_message</text><text x="632" y="196" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="8" fill="#898781">…</text><circle cx="750" cy="153" r="7.5" fill="none" stroke="#c3c2b7" stroke-width="1.7"/><path d="M740 190 L742.5 167 Q750 163 757.5 167 L760 190 Z" fill="none" stroke="#c3c2b7" stroke-width="1.7" stroke-linejoin="round"/><path d="M743 171 L733 166" fill="none" stroke="#c3c2b7" stroke-width="1.7" stroke-linecap="round"/><line x1="725" y1="164" x2="741" y2="164" stroke="#3987e5" stroke-width="2.5" stroke-linecap="round"/><path d="M729 164 q4 -5 8 0" fill="none" stroke="#3987e5" stroke-width="1.5"/><rect x="624" y="210" width="150" height="58" rx="6" fill="#1a1a19" stroke="#2c2c2a" stroke-width="1.5"/><text x="633" y="227" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.5" font-weight="600" fill="#ffffff">Needs detail? It asks.</text><text x="633" y="242" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="8.5" fill="#3987e5">q(c="a0")</text><text x="633" y="258" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9" fill="#c3c2b7">"what does a0 come with?"</text><text x="624" y="290" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" fill="#c3c2b7"><tspan x="624" dy="0">The model says "number 12, no onions"</tspan><tspan x="624" dy="16.33">and the waiter knows what that means.</tspan><tspan x="624" dy="16.33">Tiny — but the kitchen no longer checks</tspan><tspan x="624" dy="16.33">the order, so toolgz checks it instead.</tspan></text><line x1="624" y1="346" x2="868" y2="346" stroke="#2c2c2a" stroke-width="1"/><text x="624" y="365" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" fill="#898781">2 tools on the wire</text><text x="624" y="383" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="600" fill="#0ca30c">96.5% smaller</text><path d="M630 395 L635 404 L625 404 Z" fill="#bd8010"/><text x="640" y="404" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#c3c2b7">toolgz checks the order</text><text x="24" y="452" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#898781">The trade is who checks the order, not whether it gets checked. recommendLevel() picks by block size; you pass its answer in.</text></svg>