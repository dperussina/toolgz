<svg xmlns="http://www.w3.org/2000/svg" width="760" height="324" viewBox="0 0 760 324" role="img" aria-label="Task completion by level-3 map style and provider"><rect width="760" height="324" fill="#fcfcfb"/><text x="20" y="30" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="17" font-weight="600" fill="#0b0b0b">Bare tool names are not always enough signal to dispatch</text><text x="20" y="52" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#52514e"><tspan x="20" dy="0">Tasks completed, 15 per cell. Every style saves roughly the same tokens, so reliability is what separates</tspan><tspan x="20" dy="18.125">them. The shipped default has never failed; the bare-name map is the only one that has.</tspan></text><text x="220" y="92" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="600" fill="#898781" text-anchor="middle">ANTHROPIC</text><text x="284" y="92" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="600" fill="#898781" text-anchor="middle">GOOGLE</text><text x="348" y="92" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="600" fill="#898781" text-anchor="middle">OPENAI</text><text x="412" y="92" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="600" fill="#898781" text-anchor="middle">XAI</text><text x="168" y="124" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#52514e" text-anchor="end">L3 bare names</text><rect x="192" y="108" width="54" height="22" rx="4" fill="#006300" opacity="0.14"/><text x="217" y="124" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="600" fill="#006300" text-anchor="middle">15/15</text><rect x="256" y="108" width="54" height="22" rx="4" fill="#006300" opacity="0.14"/><text x="281" y="124" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="1