<svg xmlns="http://www.w3.org/2000/svg" width="760" height="290" viewBox="0 0 760 290" role="img" aria-label="Task completion by level-3 map style and provider"><rect width="760" height="290" fill="#fcfcfb"/><text x="20" y="30" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="17" font-weight="600" fill="#0b0b0b">Bare tool names are not always enough signal to dispatch</text><text x="20" y="52" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#52514e"><tspan x="20" dy="0">Tasks completed, 15 per cell. All three styles save roughly the same tokens, so reliability is what separates</tspan><tspan x="20" dy="18.125">them - and only the bare-name map fails.</tspan></text><text x="220" y="92" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="600" fill="#898781" text-anchor="middle">ANTHROPIC</text><text x="284" y="92" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="600" fill="#898781" text-anchor="middle">GOOGLE</text><text x="348" y="92" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="600" fill="#898781" text-anchor="middle">OPENAI</text><text x="412" y="92" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="600" fill="#898781" text-anchor="middle">XAI</text><text x="168" y="124" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#52514e" text-anchor="end">L3 minified</text><rect x="192" y="108" width="54" height="22" rx="4" fill="#006300" opacity="0.14"/><text x="217" y="124" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="600" fill="#006300" text-anchor="middle">15/15</text><rect x="256" y="108" width="54" height="22" rx="4" fill="#006300" opacity="0.14"/><text x="281" y="124" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="600" fill="#006300" text-anchor="middle">15/15</text><rect x="320" y="108" width="54" height="22" rx="4" fill="#006300" opacity="0.14"/><text x="345" y="124" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="600" fill="#006300" text-anchor="middle">15/15</text><rect x="384" y="108" width="54" height="22" rx="4" fill="#d03b3b" opacity="0.18"/><text x="409" y="124" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="600" fill="#d03b3b" text-anchor="middle">12/15</text><text x="460" y="124" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" font-weight="600" fill="#d03b3b">57/60</text><text x="168" y="158" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#52514e" text-anchor="end">L3 terse</text><rect x="192" y="142" width="54" height="22" rx="4" fill="#006300" opacity="0.14"/><text x="217" y="158" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="600" fill="#006300" text-anchor="middle">15/15</text><rect x="256" y="142" width="54" height="22" rx="4" fill="#006300" opacity="0.14"/><text x="281" y="158" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="600" fill="#006300" text-anchor="middle">15/15</text><rect x="320" y="142" width="54" height="22" rx="4" fill="#006300" opacity="0.14"/><text x="345" y="158" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="600" fill="#006300" text-anchor="middle">15/15</text><rect x="384" y="142" width="54" height="22" rx="4" fill="#006300" opacity="0.14"/><text x="409" y="158" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="600" fill="#006300" text-anchor="middle">15/15</text><text x="460" y="158" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" font-weight="600" fill="#006300">60/60</text><text x="168" y="192" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#52514e" text-anchor="end">L3 + req args</text><rect x="192" y="176" width="54" height="22" rx="4" fill="#006300" opacity="0.14"/><text x="217" y="192" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="600" fill="#006300" text-anchor="middle">15/15</text><rect x="256" y="176" width="54" height="22" rx="4" fill="#006300" opacity="0.14"/><text x="281" y="192" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="600" fill="#006300" text-anchor="middle">15/15</text><rect x="320" y="176" width="54" height="22" rx="4" fill="#006300" opacity="0.14"/><text x="345" y="192" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="600" fill="#006300" text-anchor="middle">15/15</text><rect x="384" y="176" width="54" height="22" rx="4" fill="#006300" opacity="0.14"/><text x="409" y="192" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="600" fill="#006300" text-anchor="middle">15/15</text><text x="460" y="192" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" font-weight="600" fill="#006300">60/60</text><text x="460" y="92" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="600" fill="#898781">TOTAL</text><text x="20" y="250" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10.5" fill="#898781"><tspan x="20" dy="0">Bare names failed on grok-4.5 deterministically - one scenario, 3 of 3 attempts, answered with zero tool calls and no error raised.</tspan><tspan x="20" dy="15.225">Naming the required arguments fixed it, and is the shipped default.</tspan></text></svg>