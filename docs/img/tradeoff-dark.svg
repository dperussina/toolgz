<svg xmlns="http://www.w3.org/2000/svg" width="760" height="350" viewBox="0 0 760 350" role="img" aria-label="Context saved versus malformed arguments by compression level"><rect width="760" height="350" fill="#1a1a19"/><text x="20" y="30" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="17" font-weight="600" fill="#ffffff">The trade: context reclaimed vs. arguments the model got wrong</text><text x="20" y="52" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#c3c2b7"><tspan x="20" dy="0">All four providers pooled. Every malformed argument was caught by schema validation and retried; no task</tspan><tspan x="20" dy="18.125">failed because of one.</tspan></text><text x="168" y="90" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="600" fill="#898781">PROMPT TOKENS SAVED</text><text x="492" y="90" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="600" fill="#898781">MALFORMED ARGUMENTS</text><text x="148" y="118" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#c3c2b7" text-anchor="end">uncompressed</text><text x="428" y="118" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" font-weight="600" fill="#ffffff">0%</text><rect x="492" y="107" width="0" height="14" rx="4" fill="#0ca30c"/><text x="500" y="118" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" font-weight="600" fill="#0ca30c">none</text><text x="148" y="148" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#c3c2b7" text-anchor="end">L1 signatures</text><rect x="168" y="137" width="71.40462276166927" height="14" rx="4" fill="#3987e5"/><text x="428" y="148" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" font-weight="600" fill="#ffffff">29%</text><rect x="492" y="137" width="0" height="14" rx="4" fill="#0ca30c"/><text x="500" y="148" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" font-weight="600" fill="#0ca30c">none</text><text x="148" y="178" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#c3c2b7" text-anchor="end">L2 namespaces</text><rect x="168" y="167" width="171.02890732651204" height="14" rx="4" fill="#3987e5"/><text x="428" y="178" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" font-weight="600" fill="#ffffff">68%</text><rect x="492" y="167" width="150" height="14" rx="4" fill="#e66767"/><text x="650" y="178" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" font-weight="600" fill="#ffffff">8</text><text x="148" y="208" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#c3c2b7" text-anchor="end">L3 terse</text><rect x="168" y="197" width="195.43717689368398" height="14" rx="4" fill="#3987e5"/><text x="428" y="208" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" font-weight="600" fill="#ffffff">78%</text><rect x="492" y="197" width="75" height="14" rx="4" fill="#e66767"/><text x="575" y="208" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" font-weight="600" fill="#ffffff">4</text><text x="148" y="238" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#c3c2b7" text-anchor="end">L3 minified</text><rect x="168" y="227" width="208.4780287705102" height="14" rx="4" fill="#3987e5"/><text x="428" y="238" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" font-weight="600" fill="#ffffff">83%</text><rect x="492" y="227" width="18.75" height="14" rx="4" fill="#e66767"/><text x="518.75" y="238" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" font-weight="600" fill="#ffffff">1</text><text x="148" y="268" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#c3c2b7" text-anchor="end">L3 + req args</text><rect x="168" y="257" width="211.21633413985958" height="14" rx="4" fill="#3987e5"/><text x="428" y="268" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" font-weight="600" fill="#ffffff">84%</text><rect x="492" y="257" width="0" height="14" rx="4" fill="#0ca30c"/><text x="500" y="268" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" font-weight="600" fill="#0ca30c">none</text><text x="20" y="320" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10.5" fill="#898781"><tspan x="20" dy="0">Levels 2 and 3 route calls through a generic argument object, which gives up the provider's constrained sampler. That is the cost;</tspan><tspan x="20" dy="15.225">validation is what covers it.</tspan></text></svg>